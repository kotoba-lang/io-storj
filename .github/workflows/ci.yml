name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: clojure -M:lint
      - run: clojure -M:test

  cljs:
    # WebCrypto is asynchronous, so the ClojureScript path runs through a
    # different composition than the JVM one. A green JVM suite is not evidence
    # for the code that ships to browsers and Workers — this job is.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: npm install -g nbb
      # sigv4 is a git dep — nbb needs the resolved classpath to see it.
      - run: nbb --classpath "$(clojure -Spath)" scripts/verify-cljs.cljs
